
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nautical Logbook Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <style>
      :root {
        --parchment-base: #f4e8d1;
        --parchment-dark: #e6d5b8;
        --ink-charcoal: #333333;
        --accent-yellow: #facb13;
        --ink-faded: #5a6e7c;
      }
      
      body {
        background-color: var(--parchment-base);
        color: var(--ink-charcoal);
        font-family: 'Montserrat', sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Aged Paper Texture */
      .bg-parchment {
        background-color: var(--parchment-base);
        background-image: 
          url('https://www.transparenttextures.com/patterns/handmade-paper.png'),
          radial-gradient(circle at center, rgba(244, 232, 209, 0) 0%, rgba(193, 172, 134, 0.2) 100%);
        background-attachment: fixed;
      }

      /* Subtle Cartography Overlays */
      .bg-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: 
          linear-gradient(rgba(51, 51, 51, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(51, 51, 51, 0.02) 1px, transparent 1px);
        background-size: 80px 80px;
        z-index: 0;
      }

      .font-serif-elegant {
        font-family: 'Cormorant Garamond', serif;
      }
      
      .font-script {
        font-family: 'Pinyon Script', cursive;
      }

      /* Custom scrollbar to match aged ink */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--parchment-dark);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--ink-charcoal);
        border-radius: 5px;
      }

      /* Highlight effect from screenshots */
      .highlight-underline {
        position: relative;
        display: inline-block;
      }
      .highlight-underline::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 4px;
        background-color: var(--accent-yellow);
        border-radius: 2px;
      }

      /* Entry Animation */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-reveal {
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
      }
    }
    </script>
  </head>
  <body class="bg-parchment">
    <div class="bg-overlay"></div>
    <div id="root"></div>
  </body>
</html>
